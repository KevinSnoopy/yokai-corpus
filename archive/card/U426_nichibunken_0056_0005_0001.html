<h1>青鬼；アオオニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0056_0005_0001.jpg" alt="青鬼；アオオニ">

<p>青色の鬼。白い布を羽織り、赤い腰布をまとっている。頭頂部は禿げ、側頭部から髪を長く垂らしている。鼻はつぶれ、口は歪んで裂け、牙が生えている。手足の指に鋭い爪が生えている。</p>
