<h1>土蜘蛛；ツチグモ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0056_0007_0000.jpg" alt="土蜘蛛；ツチグモ">

<p>源頼光が渡辺綱と共に巨大な土蜘蛛を成敗する。土蜘蛛の傷口からは人頭や髑髏が転がり出で、周囲には小蜘蛛が這い出して騒いだ。</p>
