<h1>死りやう；シリョウ</h1>
<p>死霊；シリョウ，蚊帳；カヤ</p>

<img src="../image/U426_nichibunken_0051_0027_0000.jpg" alt="死りやう；シリョウ">

<p>蚊帳の中に死霊が忍びこもうとしている。死霊は白衣で、髪が長く口が耳まで裂けてる。死霊の後ろには幣帛、数珠、錫状などが置いてある。</p>
