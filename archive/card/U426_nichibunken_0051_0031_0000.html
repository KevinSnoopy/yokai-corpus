<h1>くわしや；カシャ</h1>
<p>火車；カシャ，猫；ネコ，炎；ホノオ</p>

<img src="../image/U426_nichibunken_0051_0031_0000.jpg" alt="くわしや；カシャ">

<p>渦巻く黒雲を背景に、屋根の上で火車が女の死体を抱えている。火車の周りには炎が噴出している。</p>
