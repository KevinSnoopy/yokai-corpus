<h1>亡者；モウジャ，女；オンナ，鬼；オニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0170_0005_0000.jpg" alt="亡者；モウジャ，女；オンナ，鬼；オニ">

<p>女の亡者。白髪を垂らし、黄色い鉢巻きを締めている。白い着物を着て、しゃがみ、屈み込んでいる男の腰をさすっている。亡者の後ろに赤い肌の鬼がいる。</p>
