<h1>鼠；ネズミ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0053_0021_0002.jpg" alt="鼠；ネズミ">

<p>黒色の着物に白色の帯を締めた化物。結った髪に簪を挿し、両目は離れて横に長く、鼻が大きい。前歯が2本見え、鼠のような口元をしている。横座りして、右手に盃を持っている。</p>
