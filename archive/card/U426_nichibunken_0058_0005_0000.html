<h1>鬼；オニ，馬；ウマ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0058_0005_0000.jpg" alt="鬼；オニ，馬；ウマ">

<p>馬のような頭の鬼が、柱に縛られた亡者の男根をペンチのような道具で潰している。鬼の肌は黄色く、虎皮の腰巻と脚絆を着け、両手で道具を持っている。</p>
