<h1>秋葉権現；アキバゴンゲン，狐；キツネ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0285_0001_0000.jpg" alt="秋葉権現；アキバゴンゲン，狐；キツネ">

<p>火炎を背にして、手足に蛇を巻いた白い狐に乗る秋葉権現。黒い翼にくちばしと烏天狗のような風貌で、手には剣と黒縄を持っている。</p>
