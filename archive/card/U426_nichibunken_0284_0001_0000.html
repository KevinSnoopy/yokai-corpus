<h1>犬神；イヌガミ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0284_0001_0000.jpg" alt="犬神；イヌガミ">

<p>波の上で法輪に乗る老人。白鬚で筋骨たくましく、足には鋭い爪が生えている。腰巻きを身に付け、右手には剣を持っている。老人の背には、巻物をくわえた黒い犬が乗っている。</p>
