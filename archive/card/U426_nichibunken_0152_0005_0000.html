<h1>清姫；キヨヒメ，腰掛石；コシカケイシ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0152_0005_0000.jpg" alt="清姫；キヨヒメ，腰掛石；コシカケイシ">

<p>腰を下ろす清姫。長い髪が真上に逆立ち、赤い着物の胸元がはだけている。両脚をひらいて、石の上にどっしりと座っている。詞書に「上野村腰掛石」とある。</p>
