<h1>鯰；ナマズ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0171_0001_0000.jpg" alt="鯰；ナマズ">

<p>鯰が座って、男と話をしている。瓢箪を組み合わせた図柄の入った青い着流しを着ており、鯰の手足は人間のものである。男は煙管を手に持ち、膝元に灰皿のようなものを置いている。</p>
