<h1>山女；ヤマオンナ</h1>

<img src="../image/A5_hermitage_0005_0001_0000.jpg" alt="山女；ヤマオンナ">

<p>忠勝が山女を組み伏せる場面。山女は美しい着物を着ているが、肌は青く髪は乱れている。首の辺りを刀で刺されており、海老のように仰け反っている。</p>
