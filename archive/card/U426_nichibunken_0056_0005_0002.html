<h1>赤鬼；アカオニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0056_0005_0002.jpg" alt="赤鬼；アカオニ">

<p>赤色の鬼。青い布を羽織り、茶色の腰布をまとっている。頭頂部は禿げ、側頭部から髪を長く垂らしている。口は歪んで裂け、牙が生えている。手足の指に鋭い爪が生えている。</p>
