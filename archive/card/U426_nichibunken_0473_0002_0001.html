<p>鬼；オニ</p>

<img src="../image/U426_nichibunken_0473_0002_0001.jpg" alt="大江山の鬼神；オオエヤマノキシン">

<p>牙を持ち、頭に2本の角が生えた鬼。上半身は裸で、毛皮の腰巻をつけて褌を締めている。町の女性を両手で掴んでいる。</p>
