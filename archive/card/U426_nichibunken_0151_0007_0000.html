<h1>鯛；タイ，魚；サカナ</h1>

<img src="../image/U426_nichibunken_0151_0007_0000.jpg" alt="鯛；タイ，魚；サカナ">

<p>魚の化物。鯛と思われる。体は人間、頭部は魚の全身で、その胴と尾は体の背についている。白い衣をまとい、ひざまづいている。口を大きく開けている。</p>
