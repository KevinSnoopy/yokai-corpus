<h1>おうに；オウニ</h1>
<p>苧うに；オウニ</p>

<img src="../image/U426_nichibunken_0082_0009_0000.jpg" alt="おうに；オウニ">

<p>苧うに。大きな頭部のみが見える。目鼻が大きく、口は横に裂けて大きな歯が並んでいる。顎が突き出ている。束になった髪の毛が頭や首から生えている。</p>
