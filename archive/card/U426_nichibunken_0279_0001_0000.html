<h1>河童；カッパ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0279_0001_0000.jpg" alt="河童；カッパ">

<p>きゅうりに腰掛けた河童。全身が茶色で、頭頂には青い皿が見える。腹以外の皮膚にはコブ状の突起がある。腰蓑を身に付けており、手足には鋭い爪が生えている。</p>
