<h1>河童；カッパ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0305_0001_0000.jpg" alt="河童；カッパ">

<p>水中でうずくまり屁を放つ河童。丘の釣り人がそれに吹き飛ばされている。河童は全身緑色の鱗が生えている。頭には皿、手足には水掻きがみえる。</p>
