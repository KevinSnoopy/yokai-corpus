<h1>らいごふ；ライゴウ</h1>
<p>頼豪；ライゴウ，鼠；ネズミ，鉄鼠；テッソ</p>

<img src="../image/U426_nichibunken_0051_0034_0000.jpg" alt="らいごふ；ライゴウ">

<p>三井寺の僧頼豪の霊が鉄鼠となり経蔵に忍びこんで教典を食い破ろうとしている。周りに黒い鼠が数匹描かれている。</p>
