<h1>いやや；イヤヤ</h1>
<p>川；カワ，姿見；スガタミ</p>

<img src="../image/U426_nichibunken_0051_0010_0000.jpg" alt="いやや；イヤヤ">

<p>緋色の着物を着た女が、自らの顔を川面に映す後姿が描かれている。しかし、水面には、ひげを生やした男の顔が映っている。</p>
