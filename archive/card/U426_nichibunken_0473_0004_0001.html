<h1>鬼神；キシン</h1>

<p>鬼；オニ，大江山；オオエヤマ</p>

<img src="../image/U426_nichibunken_0473_0004_0001.jpg" alt="鬼神；キシン">

<p>頭に2本の角が生えた鬼。首に布をつけ、腰に甲をあて、胸帯や腰紐を結んでいる。城内から石を投げて反撃している。</p>
