<h1>大佛怪物；ダイブツカイブツ</h1>
<p>髑髏；ドクロ，骸骨；ガイコツ</p>

<img src="../image/U426_nichibunken_0051_0008_0000.jpg" alt="大佛怪物；ダイブツカイブツ">

<p>寺院と思われる縁側に、いくつもの崩れかけた髑髏が山のように積み上げられている。頂上の髑髏には目玉がある。</p>
