<h1>麻疹；ハシカ，麻疹の神；ハシカノカミ</h1>

<img src="../image/U426_nichibunken_0001_0001_0000.jpg" alt="麻疹；ハシカ，麻疹の神；ハシカノカミ">

<p>着物姿の女を駕籠が追い越していく。女の肩には童子のようなはしかのかみがしがみつき、駕籠にも頭頂部が禿げたはしかのかみが跨っている。</p>
