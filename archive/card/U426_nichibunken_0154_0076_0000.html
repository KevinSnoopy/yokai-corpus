<h1>布；ヌノ，獣；ケモノ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0154_0076_0000.jpg" alt="布；ヌノ，獣；ケモノ">

<p>狼のように口が長くつき出た化物。顎ひげと眉毛を長く伸ばしており、灰色の布をかぶっている。肌の色は淡い茶色で白い褌を身につけている。白目を剥いて、右脚を高く上げている。</p>
