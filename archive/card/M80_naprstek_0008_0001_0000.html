<h1>茨木童子；イバラキドウジ</h1>

<img src="../image/M80_naprstek_0008_0001_0000.jpg" alt="茨木童子；イバラキドウジ">

<p>茨木童子の腕を刀で切り落とそうとする渡辺綱。茨木童子は若い娘の姿に化けているが、肌は赤く、額には2本の角が生え、口は大きく裂けている。</p>
