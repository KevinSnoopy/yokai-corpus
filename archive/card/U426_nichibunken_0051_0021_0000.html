<h1>見越入道；ミコシニュウドウ</h1>
<p>入道；ニュウドウ</p>

<img src="../image/U426_nichibunken_0051_0021_0000.jpg" alt="見越入道；ミコシニュウドウ">

<p>草鞋がぶら下がった木の袂に見越入道が立っている。背が高く、首が長い。白衣から覗く肌には濃い体毛が生えている。また、手足には鋭い爪がある。</p>
