<h1>山男；ヤマオトコ</h1>
<p>山男；ヤマオトコ，一つ目；ヒトツメ</p>

<img src="../image/U426_nichibunken_0051_0018_0000.jpg" alt="山男；ヤマオトコ">

<p>山中に一つ目の山男が立っている。髪は長く顔は白ひげで覆われ、手足には鋭い爪が生え体毛が濃い。上半身は裸で木の葉の腰蓑、木の枝を持っている。</p>
