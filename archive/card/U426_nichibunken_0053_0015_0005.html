<h1>鬼；オニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0053_0015_0005.jpg" alt="鬼；オニ">

<p>虎皮の腰巻をはき、左手で金棒を持った鬼。角が2本生え、耳が尖っている。眉毛は逆立ち、頬と顎にひげを生やしている。肌は赤く、全身に毛が生えている。</p>
