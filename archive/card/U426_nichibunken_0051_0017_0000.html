<h1>野寺坊；ノデラボウ</h1>
<p><a href="index.html">← 图鉴索引</a></p>
<p>鐘；カネ，僧；ソウ</p>

<img src="../image/U426_nichibunken_0051_0017_0000.jpg" alt="野寺坊；ノデラボウ">

<p>大きな鐘の前に僧形の男が立っている。男の体は獣のように毛で覆われ、手足には鋭い爪がみえる。破れた法衣から出された手は顔の前で垂れている。</p>
