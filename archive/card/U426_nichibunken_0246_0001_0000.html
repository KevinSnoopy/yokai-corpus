<h1>鯰；ナマズ</h1>

<img src="../image/U426_nichibunken_0246_0001_0000.jpg" alt="鯰；ナマズ">

<p>2体の鯰が震災を皮肉った端唄を歌う。頭に笠を深くかぶり、本を持っている。復興景気で儲かった職人が駄賃を与え、それを大損した丸持ち長者が嫌そうに眺めている。</p>
