<h1>ぬれ女；ヌレオンナ</h1>
<p>濡れ女；ヌレオンナ，女；オンナ，蛇；ヘビ</p>

<img src="../image/U426_nichibunken_0082_0021_0000.jpg" alt="ぬれ女；ヌレオンナ">

<p>ぬれ女。髪を長く垂らし、長い舌を伸ばしている。体は蛇で前脚に人の掌がついている。波間にいる。</p>
