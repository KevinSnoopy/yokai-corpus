<h1>河童；カッパ，蛸；タコ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/A5_pushkin_0041_0001_0000.jpg" alt="河童；カッパ，蛸；タコ">

<p>蛸に馬乗りになって短刀で止めを刺そうとする河童。蛸は日本刀で応戦している。河童には皿と甲羅がある。腕と甲羅だけが緑色である。紺色のズボンをはいている。蛸は紺色の軍服を着ている。</p>
