<h1>鬼；オニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0150_0076_0000.jpg" alt="鬼；オニ">

<p>舞う赤い鬼。長い角を生やして、頭部にシャグマのような赤い飾りをつけ、緑の衣と赤い袴、黒い靴を身にまとっている。両手にバチのような物を持ち、足を踏みならしている。</p>
