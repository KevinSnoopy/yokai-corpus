<h1>魚；サカナ</h1>

<p>魚の化物。肌は薄黒く、魚の形の兜をかぶっている。顎ひげを生やし、白い髪を肩に垂らしている。水色の衣を着て、肩当てをつけ、片膝を立てて座っている。</p>
