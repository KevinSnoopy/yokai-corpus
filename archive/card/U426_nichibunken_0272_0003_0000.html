<h1>河童；カッパ</h1>

<img src="../image/U426_nichibunken_0272_0003_0000.jpg" alt="河童；カッパ">

<p>通行人の前に立ちはだかり脅かす河童。通行人は後ろにひっくり返っている。河童の肌は緑色で頭には皿がある。赤い舌を出し、腰蓑をつけ手足を広げている。</p>
