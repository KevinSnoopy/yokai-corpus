<h1>兎；ウサギ，女；オンナ，鹿；シカ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0150_0071_0000.jpg" alt="兎；ウサギ，女；オンナ，鹿；シカ">

<p>鹿に乗った兎の化物。頭から黒い髪を長く垂らしており、女とみられる。赤い衣と黒い靴を身につけて、鹿に乗り、手綱をつかんでいる。鹿も化物と思われる。</p>
