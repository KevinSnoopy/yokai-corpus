<h1>化物；バケモノ</h1>

<img src="../image/U426_nichibunken_0054_0009_0003.jpg" alt="化物；バケモノ">

<p>体は黄色く、褌を身につけている。白く長い眉毛が特徴的である。長い腕をくねらせ、ほうほうの体で、必死に走り去ろうとしている。</p>
