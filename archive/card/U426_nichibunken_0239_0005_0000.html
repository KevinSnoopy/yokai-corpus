<img src="../image/U426_nichibunken_0239_0005_0000.jpg" alt="幽霊；ユウレイ，火の玉；ヒノタマ">

<p>幽霊がうずくまる男に迫っている。幽霊は白装束姿で髪を振り乱し、両腕を前に突き出している。足はない。頭上に火の玉が浮いている。</p>
