<h1>實方霊入内雀；サネカタノレイジュダイスズメ</h1>
<p>藤原実方；フジワラサネカタ，霊；レイ，雀；スズメ</p>

<img src="../image/U426_nichibunken_0051_0003_0000.jpg" alt="實方霊入内雀；サネカタノレイジュダイスズメ">

<p>破れ傷んだ束帯姿の藤原実方が葛篭にもたれ座っている。彼の口からは、多くの雀たちが飛び立っている。</p>
