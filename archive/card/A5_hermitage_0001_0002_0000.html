<h1>奪魂鬼；ダッコンキ</h1>
<p><a href="index.html">← 图鉴索引</a></p>
<p>鬼；オニ</p>

<img src="../image/A5_hermitage_0001_0002_0000.jpg" alt="奪魂鬼；ダッコンキ">

<p>茶色い鬼。仁王立ちで鹿杖を右手に持ち、左手は子供の胴を鷲掴みにしている。頭には2本の角が生え、手足には鋭い爪がある。虎皮の襟巻きと脚絆を身に着けている。</p>
