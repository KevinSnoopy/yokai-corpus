<h1>奪衣婆；ダツエバ，亡者；モウジャ</h1>

<img src="../image/A5_hermitage_0001_0003_0000.jpg" alt="奪衣婆；ダツエバ，亡者；モウジャ">

<p>方膝を立て、座る老婆。黄色い衣をまとっている。後ろの松には複数の衣が掛かっており、その後ろには亡者が列をなしている。</p>
