<h1>締太鼓；シメダイコ，獣；ケモノ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0150_0064_0000.jpg" alt="締太鼓；シメダイコ，獣；ケモノ">

<p>締太鼓を叩く化物。全身が黒い毛皮で覆われており、獣の変化と考えられる。笠をかぶり、青い衣を着て、左肩に締太鼓を担ぎ、右手のバチで叩いている。</p>
