<h1>高おんな；タカオンナ</h1>
<p>高女；タカオンナ，女；オンナ</p>

<img src="../image/U426_nichibunken_0082_0024_0000.jpg" alt="高おんな；タカオンナ">

<p>高女。下半身が非常に長く、上半身は屋根らしきものの上に伸びている。長く垂らした髪をなびかせて、口を開いている。</p>
