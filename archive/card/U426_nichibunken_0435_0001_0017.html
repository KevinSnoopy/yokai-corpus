<p>蛙；カエル，動物；ドウブツ</p>

<img src="../image/U426_nichibunken_0435_0001_0017.jpg" alt="蛙；カエル，動物；ドウブツ，相撲；スモウ">

<p>まわしを締めた青い蛙が茶色い蛙と組み合い、相撲をとっている。青い蛙は低い体勢で茶色い蛙の懐に入り、左手で相手の右手を掴んでいる。</p>
