<p>幽霊；ユウレイ，墓場；ボチ</p>

<img src="../image/U426_nichibunken_0051_0022_0000.jpg" alt="ゆふれい；ユウレイ">

<p>三日月がでている夜、卒塔婆が並ぶ墓地の、柳の袂に女の幽霊が立っている。白衣の幽霊は髪が長く、三角の額紙を着けている。</p>
