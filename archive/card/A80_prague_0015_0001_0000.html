<h1>土蜘蛛；ツチグモ</h1>

<p>病床の源頼光を襲う土蜘蛛。頼光はとっさに刀に手をかけている。土蜘蛛は網のようなもの掴み引っ張っている。背後には蜘蛛の巣がみえる。</p>
