<h1>巨人；キョジン</h1>

<img src="../image/A5_pushkin_0018_0021_0000.jpg" alt="巨人；キョジン">

<p>海辺に座る巨人。両腕が無い。半裸で、腰蓑だけを身に着けている。禿頭で、耳と鼻が尖っている。</p>
