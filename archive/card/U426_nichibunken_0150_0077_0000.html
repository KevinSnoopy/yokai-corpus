<h1>猿；サル，鉦；カネ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0150_0077_0000.jpg" alt="猿；サル，鉦；カネ">

<p>鉦を打つ猿の化物。頭の後ろに大きな葉を数枚つけ、赤い衣、袴を着ている。鉦を右手に、バチを左手に持ち、片脚をあげて踊っている。</p>
