<h1>亡魂；ボウコン</h1>

<img src="../image/U426_nichibunken_0052_0023_0000.jpg" alt="亡魂；ボウコン">

<p>長い髪をだらりと垂らした、青白い体の化物。腹部がふくれあがり、細い指の先には鋭い爪が伸びている。口がへの字に曲がり、うつむきながら下の方を見つめている。</p>
