<h1>猫；ネコ，三味線；シャミセン</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0053_0022_0001.jpg" alt="猫；ネコ，三味線；シャミセン">

<p>猫のような顔をした、三味線をひく化物。女と思われる。紫色の着物に黒色の帯を締めている。眉毛は逆立ち、耳は尖り、口は大きく裂けている。</p>
