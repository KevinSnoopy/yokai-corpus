<h1>扇；オウギ，鰐；ワニ</h1>
<p><a href="index.html">← 图鉴索引</a></p>

<img src="../image/U426_nichibunken_0154_0073_0000.jpg" alt="扇；オウギ，鰐；ワニ">

<p>扇の化物。大きな耳の間に、大きな扇子を逆さまに立てている。鼻は鰐のようで、大きな口から牙が覗いており、二頭身の薄緑色の体に赤い衣を羽織っている。手足の爪は鋭い。</p>
