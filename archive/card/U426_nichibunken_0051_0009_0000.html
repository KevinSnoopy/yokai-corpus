<h1>葵の上；アオイノウエ</h1>
<p><a href="index.html">← 图鉴索引</a></p>
<p>鬼；オニ，鬼女；キジョ</p>

<img src="../image/U426_nichibunken_0051_0009_0000.jpg" alt="葵の上；アオイノウエ">

<p>炎を上げる護摩壇の前に、鬼女が座っている。頭頂には2本の角が生え、髪を振り乱し、耳まで裂けた口からは白い煙状のものが噴出している。</p>
