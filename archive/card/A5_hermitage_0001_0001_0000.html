<p>鬼；オニ</p>

<img src="../image/A5_hermitage_0001_0001_0000.jpg" alt="奪性鬼；ダッショウキ">

<p>緑色の鬼。右手に金棒を持ち、左手は前方へ突き出している。頭には角が生え、口元には鋭い牙もみえる。虎皮の襟巻きをつけ、襷掛けである。</p>
